<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>Smart Pump</title>
  <style>
    /* unslop: Ink neutral ramp, quiet chrome, one bright element (the fluid capsule) */
    :root {
      --bg-deep: #07080d;
      --bg-page: #0b0d14;
      --surface-card: #11141c;
      --surface-raised: #1a1e28;
      --surface-active: #232836;
      --hairline: rgba(238, 240, 245, 0.08);
      --hairline-hover: rgba(238, 240, 245, 0.16);
      --hairline-focus: rgba(238, 240, 245, 0.24);

      --text-primary: #eef0f5;
      --text-secondary: #a3a9b8;
      --text-muted: #7a8296;

      --accent-water: #0ea5e9;
      --accent-water-deep: #0284c7;
      --accent-water-soft: rgba(14, 165, 233, 0.12);

      --status-positive: #4cc38a;
      --status-positive-soft: rgba(76, 195, 138, 0.12);
      --status-negative: #e5484d;
      --status-negative-soft: rgba(229, 72, 77, 0.12);

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;

      --radius-card: 16px;
      --radius-inner: 10px;
      --radius-pill: 100px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      overflow-x: clip;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    :focus-visible {
      outline: 2px solid var(--hairline-focus);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .shell {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 160ms var(--ease), color 160ms var(--ease);
    }

    .status-badge:hover {
      border-color: var(--hairline-hover);
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-positive);
    }

    .status-dot.red { background: var(--status-negative); }
    .status-dot.amber { background: #f59e0b; }

    /* The One Bright Element: Fluid Sight Hero Card */
    .tank-hero {
      background: var(--surface-card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tank-display-split {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* Precision Sight Capsule */
    .capsule-chassis {
      width: 88px;
      height: 184px;
      border-radius: 44px;
      background: var(--bg-deep);
      border: 1.5px solid var(--hairline);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Non-Contact Capacitive Foil Electrode Marker */
    .foil-sensor-marker {
      position: absolute;
      top: 14px;
      right: 0;
      width: 5px;
      height: 20px;
      background: rgba(238, 240, 245, 0.25);
      border-radius: 2px 0 0 2px;
      z-index: 5;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: linear-gradient(180deg, var(--accent-water) 0%, var(--accent-water-deep) 70%, #034b75 100%);
      transition: height 400ms var(--ease);
    }

    .liquid-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #7dd3fc;
    }

    .tank-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .meta-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .meta-percentage {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -1.5px;
      line-height: 1;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin: 2px 0;
    }

    .meta-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .meta-foil-status {
      font-size: 12px;
      color: var(--accent-water);
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Quiet Level Slider */
    .slider-track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
      border-top: 1px solid var(--hairline);
    }

    .slider-track input[type=range] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-raised);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .slider-track input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 120ms var(--ease);
    }

    .slider-track input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .slider-label {
      font-size: 11px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 32px;
      text-align: right;
    }

    /* Primary Pump Switch (Quiet Chrome) */
    .pump-btn {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-inner);
      border: 1px solid var(--hairline);
      background: var(--surface-raised);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), transform 120ms var(--ease);
    }

    .pump-btn:hover {
      background: var(--surface-active);
      border-color: var(--hairline-hover);
    }

    .pump-btn:active {
      transform: scale(0.98);
    }

    .pump-btn.running {
      background: var(--status-positive);
      color: #07080d;
      border-color: var(--status-positive);
      font-weight: 600;
    }

    .pump-btn.fault {
      background: var(--status-negative);
      color: #ffffff;
      border-color: var(--status-negative);
      font-weight: 600;
    }

    /* Integrated Telemetry Strip (Single Card, 3 Columns) */
    .telemetry-strip {
      background: var(--surface-card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 12px 16px;
      gap: 12px;
    }

    .telemetry-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .telemetry-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .telemetry-val {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Unobtrusive Test Triggers (Single Quiet Row) */
    .test-shelf {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .test-shelf-label {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .test-chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .test-chip {
      background: var(--surface-card);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
    }

    .test-chip:hover {
      background: var(--surface-raised);
      border-color: var(--hairline-hover);
      color: var(--text-primary);
    }

    .test-chip:active {
      transform: scale(0.97);
    }

    .test-chip.full-row {
      grid-column: span 4;
      padding: 7px;
      color: var(--text-muted);
    }

    /* Quiet Notification Banner */
    .notice {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: var(--surface-raised);
      border: 1px solid var(--hairline-hover);
      color: var(--text-primary);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 220ms var(--ease);
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }

    .notice.visible {
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <!-- Firebase Realtime Cloud SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="notice" id="notice">Notification</div>

  <main class="shell">

    <!-- Top Bar -->
    <header class="top-bar">
      <h1 class="brand-title">Smart Pump</h1>
      <button class="status-badge" id="audioToggle" onclick="toggleAudio()" title="Toggle Web Audio feedback">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">250m link ok</span>
      </button>
    </header>

    <!-- The One Bright Element: Fluid Sight Hero Card -->
    <section class="tank-hero">
      <div class="tank-display-split">
        <div class="capsule-chassis">
          <div class="foil-sensor-marker" title="Non-contact capacitive foil electrode (overflow cutoff)"></div>
          <div class="liquid-fill" id="liquidFill"></div>
        </div>

        <div class="tank-meta">
          <span class="meta-label">Water storage</span>
          <div class="meta-percentage" id="levelPct">65%</div>
          <div class="meta-sub" id="levelSub">3.25 ft &bull; ~14 min to full</div>
          <div class="meta-foil-status" id="foilStatus">Foil sensor: armed</div>
        </div>
      </div>

      <div class="slider-track">
        <input type="range" id="levelSlider" min="0" max="100" value="65" oninput="adjustLevel(this.value)">
        <span class="slider-label" id="sliderNum">65%</span>
      </div>
    </section>

    <!-- Primary Action Pump Switch -->
    <button class="pump-btn" id="pumpBtn" onclick="togglePump()">
      <span id="pumpBtnText">Start Pump</span>
    </button>

    <!-- Integrated Telemetry Strip (4 Columns) -->
    <section class="telemetry-strip" style="grid-template-columns: repeat(4, 1fr); padding: 12px 10px; gap: 8px;">
      <div class="telemetry-col">
        <span class="telemetry-label">Grid voltage</span>
        <span class="telemetry-val" id="voltageVal">230 V</span>
      </div>
      <div class="telemetry-col">
        <span class="telemetry-label">Load current</span>
        <span class="telemetry-val" id="ampsVal">0.0 A</span>
      </div>
      <div class="telemetry-col">
        <span class="telemetry-label">Active power</span>
        <span class="telemetry-val" id="powerVal">0.00 kW</span>
      </div>
      <div class="telemetry-col">
        <span class="telemetry-label">Runtime</span>
        <span class="telemetry-val" id="runtimeVal">00:00</span>
      </div>
    </section>

    <!-- Unobtrusive Test Triggers (Bottom Shelf) -->
    <section class="test-shelf">
      <div class="test-shelf-label">Simulate safety cutoffs (ZMPT101B + ZMCT103C):</div>
      <div class="test-chips" style="grid-template-columns: repeat(3, 1fr);">
        <button class="test-chip" onclick="simulateDryRun()">Dry-Run (&lt;4A)</button>
        <button class="test-chip" onclick="simulateOverload()">Overload (&gt;16A)</button>
        <button class="test-chip" onclick="simulateOverflow()">Overflow (Full)</button>
        <button class="test-chip" onclick="simulateBrownout()">Brownout (&lt;175V)</button>
        <button class="test-chip" onclick="simulateSurge()">Surge (&gt;265V)</button>
        <button class="test-chip" onclick="simulateLinkLoss()">Lost Link (Watchdog)</button>
        <button class="test-chip full-row" style="grid-column: span 3;" onclick="resetSystem()">Reset to standby</button>
      </div>
    </section>

  </main>

  <script>
    // Firebase Cloud Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCYgqbFgKVAoZ835owETNF1O9Zu8QYwIgc",
      authDomain: "smart-pump-9b532.firebaseapp.com",
      databaseURL: "https://smart-pump-9b532-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "smart-pump-9b532",
      storageBucket: "smart-pump-9b532.firebasestorage.app",
      messagingSenderId: "109214786839",
      appId: "1:109214786839:web:d0071d2e066bf0d07b0352"
    };

    let db = null;
    let isCloudOnline = false;

    // System State
    let isRunning = false;
    let isStarting = false;
    let activeFault = null;
    let currentAmps = 0.0;
    let gridVoltage = 230.0;
    let currentLevel = 65;
    let runtimeSec = 0;
    let runTimer = null;
    let audioEnabled = true;

    // Initialize Firebase Realtime Sync & Connection Mode Detection
    const isLocalHost = window.location.hostname === 'pump.local' ||
                        /^192\.168\./.test(window.location.hostname) ||
                        /^10\./.test(window.location.hostname) ||
                        /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(window.location.hostname);

    if (isLocalHost) {
      console.log("Direct ESP32 Local Mode active (http://" + window.location.hostname + ")");
      const statusLbl = document.getElementById('statusLabel');
      if (statusLbl) statusLbl.innerText = 'Local Direct';
      
      // Direct polling from ESP32 local WebServer
      setInterval(() => {
        fetch('/status')
          .then(res => res.json())
          .then(data => {
            if (data.voltage !== undefined) gridVoltage = data.voltage;
            if (data.current !== undefined) currentAmps = data.current;
            if (data.waterLevel !== undefined) {
              currentLevel = data.waterLevel;
              renderLevel();
            }
            if (data.running !== undefined && !isStarting) {
              if (data.running !== isRunning) {
                isRunning = data.running;
                const btn = document.getElementById('pumpBtn');
                const text = document.getElementById('pumpBtnText');
                if (isRunning) {
                  btn.className = 'pump-btn running';
                  text.innerText = `Stop Pump (${currentAmps.toFixed(1)} A)`;
                  document.getElementById('statusDot').className = 'status-dot';
                  document.getElementById('statusLabel').innerText = `${currentAmps.toFixed(1)}A running`;
                  startTimers();
                } else {
                  btn.className = 'pump-btn';
                  text.innerText = 'Start Pump';
                  document.getElementById('statusDot').className = 'status-dot';
                  document.getElementById('statusLabel').innerText = 'Local Direct';
                  stopTimers();
                }
              }
            }
            renderTelemetry();
          })
          .catch(e => console.log('Local status fetch note:', e));
      }, 2000);
    }

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      isCloudOnline = true;
      console.log("Firebase Realtime Cloud connected!");
      if (!isLocalHost) {
        const statusLbl = document.getElementById('statusLabel');
        if (statusLbl) statusLbl.innerText = 'Cloud Sync Live';
      }

      // Realtime listener for live telemetry
      db.ref('telemetry').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          if (val.voltage !== undefined) gridVoltage = val.voltage;
          if (val.current !== undefined) currentAmps = val.current;
          if (val.waterLevel !== undefined) {
            currentLevel = val.waterLevel;
            renderLevel();
          }
          if (val.pumpRunning !== undefined && !isStarting) {
            if (val.pumpRunning !== isRunning) {
              isRunning = val.pumpRunning;
              const btn = document.getElementById('pumpBtn');
              const text = document.getElementById('pumpBtnText');
              if (isRunning) {
                btn.className = 'pump-btn running';
                text.innerText = `Stop Pump (${currentAmps.toFixed(1)} A)`;
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('statusLabel').innerText = `${currentAmps.toFixed(1)}A running`;
                startTimers();
              } else {
                btn.className = 'pump-btn';
                text.innerText = 'Start Pump';
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('statusLabel').innerText = 'Cloud Sync Live';
                stopTimers();
              }
            }
          }
          if (val.fault && val.fault !== 'NONE') {
            activeFault = val.fault;
          } else {
            activeFault = null;
          }
          renderTelemetry();
        }
      });
    } catch (err) {
      console.warn("Local simulation fallback active:", err);
    }

    // Web Audio Synthesizer (Harmonic Clean Tones)
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, ms, delay = 0, type = 'sine') {
      if (!audioEnabled) return;
      try {
        const ctx = getAudio();
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (ms / 1000));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + (ms / 1000));
        }, delay);
      } catch (e) {}
    }

    function chimeStart() {
      playTone(523, 70, 0);
      playTone(659, 70, 90);
      playTone(784, 140, 180);
    }

    function chimeStop() {
      playTone(784, 70, 0);
      playTone(523, 140, 90);
    }

    function chimeVictory() {
      playTone(523, 80, 0);
      playTone(659, 80, 100);
      playTone(784, 90, 200);
      playTone(1046, 260, 310);
    }

    function chimeAlarm() {
      playTone(1900, 60, 0, 'square');
      playTone(1900, 60, 120, 'square');
      playTone(1900, 60, 240, 'square');
    }

    function showNotice(text) {
      const el = document.getElementById('notice');
      el.innerText = text;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 2600);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      showNotice(audioEnabled ? 'Audio feedback enabled' : 'Audio feedback muted');
    }

    // Pump Primary Action
    function togglePump() {
      if (activeFault) {
        chimeAlarm();
        showNotice('Trip locked: ' + activeFault + '. Tap reset below.');
        return;
      }
      if (isRunning || isStarting) {
        if (isLocalHost) {
          fetch('/stop', { method: 'POST' }).catch(e => console.log('Local stop err:', e));
        }
        if (db) {
          db.ref('command').set({ action: 'STOP', timestamp: Date.now() });
          db.ref('telemetry/pumpRunning').set(false);
        }
        stopPump();
      } else {
        if (isLocalHost) {
          fetch('/start', { method: 'POST' }).catch(e => console.log('Local start err:', e));
        }
        if (db) {
          db.ref('command').set({ action: 'START', timestamp: Date.now() });
        }
        startPump();
      }
    }

    function startPump() {
      isStarting = true;
      chimeStart();

      const btn = document.getElementById('pumpBtn');
      const text = document.getElementById('pumpBtnText');
      btn.className = 'pump-btn';
      text.innerText = 'Starting (1.8s pulse)...';

      currentAmps = 28.4;
      renderTelemetry();
      showNotice('Relay 2 fired (1.8s start pulse)');

      setTimeout(() => {
        isStarting = false;
        isRunning = true;
        currentAmps = 10.2;

        btn.className = 'pump-btn running';
        text.innerText = 'Stop Pump (10.2 A)';

        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusLabel').innerText = '10.2A running';

        startTimers();
        renderTelemetry();
        if (db) {
          db.ref('telemetry').update({
            pumpRunning: true,
            current: 10.2,
            voltage: 230.0,
            power: 1.99,
            fault: 'NONE'
          });
        }
        showNotice('Contactor latched closed');
      }, 1800);
    }

    function stopPump() {
      isRunning = false;
      isStarting = false;
      currentAmps = 0.0;
      chimeStop();

      if (db) {
        db.ref('telemetry').update({
          pumpRunning: false,
          current: 0.0,
          power: 0.0
        });
      }

      const btn = document.getElementById('pumpBtn');
      const text = document.getElementById('pumpBtnText');
      btn.className = 'pump-btn';
      text.innerText = 'Start Pump';

      document.getElementById('statusDot').className = 'status-dot';
      document.getElementById('statusLabel').innerText = '250m link ok';

      stopTimers();
      renderTelemetry();
    }

    function startTimers() {
      stopTimers();
      runTimer = setInterval(() => {
        runtimeSec++;
        const m = String(Math.floor(runtimeSec / 60)).padStart(2, '0');
        const s = String(runtimeSec % 60).padStart(2, '0');
        document.getElementById('runtimeVal').innerText = `${m}:${s}`;

        if (currentLevel < 100) {
          currentLevel = Math.min(100, currentLevel + 0.35);
          renderLevel();
        } else {
          simulateOverflow();
        }
      }, 1000);
    }

    function stopTimers() {
      clearInterval(runTimer);
    }

    function renderTelemetry() {
      document.getElementById('voltageVal').innerText = Math.round(gridVoltage) + ' V';
      document.getElementById('ampsVal').innerText = currentAmps.toFixed(1) + ' A';
      const kw = (currentAmps * gridVoltage * 0.85 / 1000).toFixed(2);
      document.getElementById('powerVal').innerText = kw + ' kW';
    }

    function renderLevel() {
      document.getElementById('liquidFill').style.height = currentLevel + '%';
      document.getElementById('levelPct').innerText = Math.round(currentLevel) + '%';
      const depth = (currentLevel * 5.0 / 100).toFixed(2);
      const mins = Math.max(0, Math.round((100 - currentLevel) * 0.4));
      document.getElementById('levelSub').innerText = `${depth} ft \u2022 ~${mins} min to full`;

      document.getElementById('levelSlider').value = Math.round(currentLevel);
      document.getElementById('sliderNum').innerText = `${Math.round(currentLevel)}%`;

      const foil = document.getElementById('foilStatus');
      if (currentLevel >= 100) {
        foil.innerText = 'Foil sensor: tripped (100% full)';
        foil.style.color = 'var(--status-positive)';
      } else {
        foil.innerText = 'Foil sensor: armed';
        foil.style.color = 'var(--accent-water)';
      }
    }

    function adjustLevel(val) {
      currentLevel = parseFloat(val);
      renderLevel();
      if (db) {
        db.ref('telemetry/waterLevel').set(Math.round(currentLevel));
      }
      if (currentLevel >= 100) {
        simulateOverflow();
      }
    }

    // Safety Simulation Handlers
    function simulateDryRun() {
      if (!isRunning) startPump();
      setTimeout(() => {
        currentAmps = 2.4;
        renderTelemetry();
        showNotice('Current dropped to 2.4A (water depleted)');

        setTimeout(() => {
          activeFault = 'DRY RUN';
          stopPump();
          chimeAlarm();

          const btn = document.getElementById('pumpBtn');
          btn.className = 'pump-btn fault';
          document.getElementById('pumpBtnText').innerText = 'Fault: Borewell Dry-Run';

          document.getElementById('statusDot').className = 'status-dot red';
          document.getElementById('statusLabel').innerText = 'Dry-run trip';
          showNotice('Dry-run cutoff: motor protected');
        }, 2200);
      }, 1200);
    }

    function simulateOverload() {
      if (!isRunning) startPump();
      setTimeout(() => {
        currentAmps = 18.2;
        renderTelemetry();

        activeFault = 'OVERLOAD';
        stopPump();
        chimeAlarm();

        const btn = document.getElementById('pumpBtn');
        btn.className = 'pump-btn fault';
        document.getElementById('pumpBtnText').innerText = 'Fault: Overload Trip (18.2 A)';

        document.getElementById('statusDot').className = 'status-dot red';
        document.getElementById('statusLabel').innerText = 'Overload trip';
        showNotice('Overload interrupt executed in 74ms');
      }, 1000);
    }

    function simulateOverflow() {
      currentLevel = 100;
      renderLevel();
      if (isRunning) stopPump();
      chimeVictory();
      showNotice('Tank 100% full: auto-stopped');
    }

    function simulateLinkLoss() {
      document.getElementById('statusDot').className = 'status-dot amber';
      document.getElementById('statusLabel').innerText = 'Link lost';
      showNotice('250m link lost: 3-min timer counting');

      setTimeout(() => {
        activeFault = 'LINK LOSS';
        stopPump();
        chimeAlarm();

        const btn = document.getElementById('pumpBtn');
        btn.className = 'pump-btn fault';
        document.getElementById('pumpBtnText').innerText = 'Fault: Watchdog Timeout';
      }, 1800);
    }

    function simulateBrownout() {
      if (!isRunning) startPump();
      setTimeout(() => {
        gridVoltage = 162.0; // Dips below 175V cutoff
        renderTelemetry();
        showNotice('Grid voltage dropped to 162V (Brownout)');

        setTimeout(() => {
          activeFault = 'BROWNOUT (<175V)';
          stopPump();
          chimeAlarm();

          const btn = document.getElementById('pumpBtn');
          btn.className = 'pump-btn fault';
          document.getElementById('pumpBtnText').innerText = 'Fault: Low Voltage Brownout (162V)';

          document.getElementById('statusDot').className = 'status-dot red';
          document.getElementById('statusLabel').innerText = 'Brownout trip';
          showNotice('ZMPT101B cutoff: Stator windings protected');
        }, 1200);
      }, 1000);
    }

    function simulateSurge() {
      if (!isRunning) startPump();
      setTimeout(() => {
        gridVoltage = 278.0; // Surges above 265V cutoff
        renderTelemetry();
        showNotice('Grid voltage spiked to 278V (Surge)');

        setTimeout(() => {
          activeFault = 'SURGE (>265V)';
          stopPump();
          chimeAlarm();

          const btn = document.getElementById('pumpBtn');
          btn.className = 'pump-btn fault';
          document.getElementById('pumpBtnText').innerText = 'Fault: High Voltage Surge (278V)';

          document.getElementById('statusDot').className = 'status-dot red';
          document.getElementById('statusLabel').innerText = 'Surge trip';
          showNotice('ZMPT101B cutoff: Motor protected');
        }, 1200);
      }, 1000);
    }

    function resetSystem() {
      activeFault = null;
      stopPump();
      gridVoltage = 230.0;
      currentLevel = 65;
      runtimeSec = 0;
      document.getElementById('runtimeVal').innerText = '00:00';
      document.getElementById('statusDot').className = 'status-dot';
      document.getElementById('statusLabel').innerText = '250m link ok';
      renderLevel();
      renderTelemetry();
      showNotice('System reset to standby');
    }

    // Initial Render
    renderLevel();
    renderTelemetry();
  </script>
</body>
</html>
