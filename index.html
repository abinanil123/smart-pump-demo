<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Smart Pump</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #141417;
      --surface-2: #1c1c20;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.2);
      --text: #fafafa;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --blue: #0ea5e9;
      --blue-soft: rgba(14, 165, 233, 0.12);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    .app {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 100px;
      cursor: pointer;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot.blue { background: var(--blue); box-shadow: 0 0 6px var(--blue); }

    /* Center Visual: The Minimal Liquid Capsule */
    .tank-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
    }

    /* Minimalist Fluid Capsule */
    .capsule-tube {
      width: 84px;
      height: 170px;
      border-radius: 42px;
      background: #0d0e12;
      border: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    /* Capacitive sensor line */
    .capsule-tube::before {
      content: '';
      position: absolute;
      top: 14px;
      right: 0;
      width: 6px;
      height: 18px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px 0 0 3px;
      z-index: 4;
    }

    .capsule-water {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .capsule-water::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #7dd3fc;
      box-shadow: 0 0 8px #7dd3fc;
    }

    .tank-data {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .tank-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .tank-pct {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .tank-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .tank-foil-state {
      font-size: 11px;
      color: var(--blue);
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Slider Under Tank */
    .slider-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
    }

    .slider-wrap input[type=range] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-2);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .slider-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    /* Minimalist Power Button */
    .main-btn {
      width: 100%;
      height: 56px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .main-btn.running {
      background: var(--green);
      color: #000000;
      border-color: var(--green);
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.25);
    }

    .main-btn.fault {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);
    }

    .main-btn .btn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .main-btn.running .btn-dot {
      background: #000000;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 3 Clean Metrics in One Row */
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    /* Client Demo Pills (Bottom Minimalist Row) */
    .demo-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .demo-header {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
      text-align: center;
    }

    .demo-pills {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }

    .pill-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 8px 4px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      color: var(--text);
      border-color: var(--border-active);
    }

    .pill-btn:active {
      transform: scale(0.95);
      background: var(--surface-2);
    }

    .pill-btn.reset {
      grid-column: span 4;
      padding: 8px;
      color: var(--text-dim);
    }

    .pill-btn.reset:hover {
      color: var(--text);
    }

    /* Minimal Toast Banner */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: #1c1c20;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 100px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="toast" id="toast">Notification</div>

  <div class="app">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">Smart Pump</div>
      <div class="status-pill" id="statusPill" onclick="toggleAudio()">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">250m link</span>
      </div>
    </header>

    <!-- Center Hero: Minimal Liquid Capsule -->
    <section class="tank-hero">
      <div class="capsule-tube">
        <div class="capsule-water" id="capsuleWater"></div>
      </div>

      <div class="tank-data">
        <span class="tank-label">Water Level</span>
        <div class="tank-pct" id="tankPct">65%</div>
        <div class="tank-sub" id="tankSub">3.2 ft · ~14 min to full</div>
        <div class="tank-foil-state" id="foilState">Foil sensor: Armed</div>
      </div>
    </section>

    <!-- Clean Slider to Adjust Level -->
    <div class="slider-wrap">
      <input type="range" id="levelSlider" min="0" max="100" value="65" oninput="setLevel(this.value)">
    </div>

    <!-- The One Primary Action: Power Switch -->
    <button class="main-btn" id="mainBtn" onclick="togglePump()">
      <span class="btn-dot"></span>
      <span id="btnLabel">Start Pump</span>
    </button>

    <!-- 3 Quiet Stats in One Row -->
    <div class="metrics-row">
      <div class="metric-card">
        <span class="metric-title">Current</span>
        <span class="metric-value" id="ampsVal">0.0 A</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Power</span>
        <span class="metric-value" id="powerVal">0.0 kW</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Runtime</span>
        <span class="metric-value" id="runtimeVal">00:00</span>
      </div>
    </div>

    <!-- Client Demo Failsafe Triggers (Quiet & Minimal) -->
    <div class="demo-section">
      <div class="demo-header">Test safety cutoffs for client:</div>
      <div class="demo-pills">
        <button class="pill-btn" onclick="testDryRun()">Dry-Run</button>
        <button class="pill-btn" onclick="testOverload()">Overload</button>
        <button class="pill-btn" onclick="testOverflow()">Overflow</button>
        <button class="pill-btn" onclick="testLinkLoss()">Lost Link</button>
        <button class="pill-btn reset" onclick="resetAll()">Reset Standby</button>
      </div>
    </div>

  </div>

  <script>
    // Minimal State
    let isRunning = false;
    let isStarting = false;
    let activeFault = null;
    let currentAmps = 0.0;
    let currentLevel = 65;
    let runtimeSeconds = 0;
    let runTimer = null;
    let soundEnabled = true;

    // Web Audio Synthesizer (Pure Clean Chimes)
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, ms, delay = 0, type = 'sine') {
      if (!soundEnabled) return;
      try {
        const ctx = getAudio();
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (ms / 1000));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + (ms / 1000));
        }, delay);
      } catch (e) {}
    }

    function soundStart() {
      playTone(523, 70, 0);
      playTone(659, 70, 90);
      playTone(784, 140, 180);
    }

    function soundStop() {
      playTone(784, 70, 0);
      playTone(523, 140, 90);
    }

    function soundVictory() {
      playTone(523, 80, 0);
      playTone(659, 80, 100);
      playTone(784, 90, 200);
      playTone(1046, 250, 310);
    }

    function soundAlarm() {
      playTone(2000, 60, 0, 'square');
      playTone(2000, 60, 120, 'square');
      playTone(2000, 60, 240, 'square');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      showToast(soundEnabled ? 'Audio on' : 'Audio muted');
    }

    // Toggle Pump
    function togglePump() {
      if (activeFault) {
        soundAlarm();
        showToast('Trip locked: ' + activeFault + '. Tap Reset.');
        return;
      }
      if (isRunning || isStarting) {
        stopPump();
      } else {
        startPump();
      }
    }

    function startPump() {
      isStarting = true;
      soundStart();

      const btn = document.getElementById('mainBtn');
      const label = document.getElementById('btnLabel');
      btn.className = 'main-btn';
      label.innerText = 'Starting (1.8s pulse)...';

      currentAmps = 28.4;
      renderMetrics();
      showToast('Relay 2 fired (1.8s start pulse)');

      setTimeout(() => {
        isStarting = false;
        isRunning = true;
        currentAmps = 10.2;

        btn.className = 'main-btn running';
        label.innerText = 'Stop Pump · 10.2A';

        document.getElementById('statusDot').className = 'dot';
        document.getElementById('statusText').innerText = 'Running';

        startTimers();
        renderMetrics();
        showToast('Contactor latched: 10.2A running');
      }, 1800);
    }

    function stopPump() {
      isRunning = false;
      isStarting = false;
      currentAmps = 0.0;
      soundStop();

      const btn = document.getElementById('mainBtn');
      const label = document.getElementById('btnLabel');
      btn.className = 'main-btn';
      label.innerText = 'Start Pump';

      document.getElementById('statusDot').className = 'dot';
      document.getElementById('statusText').innerText = '250m link';

      stopTimers();
      renderMetrics();
    }

    function startTimers() {
      stopTimers();
      runTimer = setInterval(() => {
        runtimeSeconds++;
        const m = String(Math.floor(runtimeSeconds / 60)).padStart(2, '0');
        const s = String(runtimeSeconds % 60).padStart(2, '0');
        document.getElementById('runtimeVal').innerText = `${m}:${s}`;

        if (currentLevel < 100) {
          currentLevel = Math.min(100, currentLevel + 0.3);
          renderTank();
        } else {
          testOverflow();
        }
      }, 1000);
    }

    function stopTimers() {
      clearInterval(runTimer);
    }

    function renderMetrics() {
      document.getElementById('ampsVal').innerText = currentAmps.toFixed(1) + ' A';
      const kw = (currentAmps * 230 * 0.88 / 1000).toFixed(1);
      document.getElementById('powerVal').innerText = kw + ' kW';
    }

    function renderTank() {
      document.getElementById('capsuleWater').style.height = currentLevel + '%';
      document.getElementById('tankPct').innerText = Math.round(currentLevel) + '%';
      const depth = (currentLevel * 5.0 / 100).toFixed(1);
      const mins = Math.max(0, Math.round((100 - currentLevel) * 0.4));
      document.getElementById('tankSub').innerText = `${depth} ft · ~${mins} min to full`;
      document.getElementById('levelSlider').value = Math.round(currentLevel);

      const foil = document.getElementById('foilState');
      if (currentLevel >= 100) {
        foil.innerText = 'Foil sensor: Tripped (100% full)';
        foil.style.color = 'var(--green)';
      } else {
        foil.innerText = 'Foil sensor: Armed';
        foil.style.color = 'var(--blue)';
      }
    }

    function setLevel(val) {
      currentLevel = parseFloat(val);
      renderTank();
      if (currentLevel >= 100) {
        testOverflow();
      }
    }

    // Safety Demo Triggers
    function testDryRun() {
      if (!isRunning) startPump();
      setTimeout(() => {
        currentAmps = 2.4;
        renderMetrics();
        showToast('Current dropped to 2.4A (water depleted)');

        setTimeout(() => {
          activeFault = 'DRY RUN';
          stopPump();
          soundAlarm();

          const btn = document.getElementById('mainBtn');
          btn.className = 'main-btn fault';
          document.getElementById('btnLabel').innerText = 'Fault: Borewell Dry-Run Trip';

          document.getElementById('statusDot').className = 'dot red';
          document.getElementById('statusText').innerText = 'Dry-run trip';
          showToast('Dry-run auto-stop: motor protected');
        }, 2200);
      }, 1200);
    }

    function testOverload() {
      if (!isRunning) startPump();
      setTimeout(() => {
        currentAmps = 18.2;
        renderMetrics();

        activeFault = 'OVERLOAD';
        stopPump();
        soundAlarm();

        const btn = document.getElementById('mainBtn');
        btn.className = 'main-btn fault';
        document.getElementById('btnLabel').innerText = 'Fault: Overload Trip (18.2A)';

        document.getElementById('statusDot').className = 'dot red';
        document.getElementById('statusText').innerText = 'Overload trip';
        showToast('Overload trip executed in 74ms');
      }, 1000);
    }

    function testOverflow() {
      currentLevel = 100;
      renderTank();
      if (isRunning) stopPump();
      soundVictory();
      showToast('Tank 100% full: auto-stopped');
    }

    function testLinkLoss() {
      document.getElementById('statusDot').className = 'dot red';
      document.getElementById('statusText').innerText = 'Link lost';
      showToast('250m link lost: 3-min timer counting');

      setTimeout(() => {
        activeFault = 'LINK LOSS';
        stopPump();
        soundAlarm();

        const btn = document.getElementById('mainBtn');
        btn.className = 'main-btn fault';
        document.getElementById('btnLabel').innerText = 'Fault: Watchdog Timeout';
      }, 1800);
    }

    function resetAll() {
      activeFault = null;
      stopPump();
      currentLevel = 65;
      runtimeSeconds = 0;
      document.getElementById('runtimeVal').innerText = '00:00';
      document.getElementById('statusDot').className = 'dot';
      document.getElementById('statusText').innerText = '250m link';
      renderTank();
      renderMetrics();
      showToast('Reset to standby');
    }

    // Initial Render
    renderTank();
    renderMetrics();
  </script>
</body>
</html>
